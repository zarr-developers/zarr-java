name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    services:
      s3mock:
        # This service will only start if the runner is Linux
        image: ${{ matrix.os == 'ubuntu-latest' && 'adobe/s3mock:3.11.0' || '' }}
        ports:
          - 9090:9090
        env:
          initialBuckets: zarr-test-bucket
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Cache testdata
        id: cache-testdata
        uses: actions/cache@v4
        with:
          path: testdata/l4_sample
          key: testdata-l4_sample-v1

      - name: Download testdata
        if: steps.cache-testdata.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
            https://static.webknossos.org/data/zarr_v3/l4_sample.zip -o testdata/l4_sample.zip
          cd testdata
          unzip -q l4_sample.zip
          rm l4_sample.zip

      - name: Create testoutput
        run: mkdir -p testoutput

      - name: Build
        run: mvn compile

      - name: Test
        env:
          MAVEN_OPTS: "-Xmx6g"
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            mvn --no-transfer-progress test -DargLine="-Xmx6g" -DrunS3Tests=true
          else
            mvn --no-transfer-progress test -DargLine="-Xmx6g"
          fi
      - name: Assemble JAR
        run: mvn package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ runner.os }}
          path: target/*.jar
